# alembic.ini — Alembic migration configuration for Cipherix
# Place this file in backend/ (the directory you run alembic from).
# Run migrations with:
#   cd backend
#   alembic upgrade head

[alembic]
# Path to the migration scripts directory (relative to this file).
script_location = app/database/migrations

# Template used when generating new revision files.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone for %%(year)d etc. placeholders.
timezone = UTC

# Max line length in generated migration files.
truncate_slug_length = 40

# Database URL is read from the application settings at runtime via env.py.
# Do NOT set sqlalchemy.url here — env.py reads it from settings.
# sqlalchemy.url =

[post_write_hooks]
# Optional: run ruff/black on newly generated migration files.
# hooks = ruff
# ruff.type = console_scripts
# ruff.entrypoint = ruff
# ruff.options = check --fix REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
